# Example consumer workflow — copy this into your Rust repo at
# .github/workflows/pr-audit.yml
#
# It runs rust-symbol-audit on every PR that touches Cargo.lock and posts a
# capability-diff comment. If no dependency versions changed, the action exits
# silently.
name: dependency capability audit

on:
  pull_request:
    # Only bother when the lockfile could have changed.
    paths:
      - "Cargo.lock"

permissions:
  contents: read
  pull-requests: write   # required so the action can post the PR comment

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # base.sha must be reachable to diff the lockfile; full history is the
          # simplest guarantee. (The action also best-effort-fetches base.sha,
          # but fetch-depth: 0 removes all doubt.)
          fetch-depth: 0

      - name: rust-symbol-audit
        # In your own repo, replace this with:  uses: booyaka101/rust-symbol-audit@v1
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          max-crates: "5"
