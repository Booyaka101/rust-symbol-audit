name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch. A second push supersedes the first instead of queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
          nm --version | head -1
          python3 --version

      - name: Cache cargo registry + rustfilt
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/rustfilt
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: rsa-tests-${{ runner.os }}-rustfilt-v1

      - name: Install rustfilt (demangler)
        run: command -v rustfilt >/dev/null 2>&1 || cargo install rustfilt --quiet

      - name: Run acceptance suite (48 checks)
        env:
          WORK: ${{ runner.temp }}/rsa-local
        run: bash test/run_local.sh
