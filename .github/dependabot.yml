version: 2

# This repo ships a composite GitHub Action and has no root package.json, so only
# the github-actions ecosystem applies. Declaring npm here makes Dependabot abort
# the run with "/package.json not found".
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(ci)'
    groups:
      all-actions:
        patterns: ['*']
