name: "rust-symbol-audit"
description: "A capability-creep triage gate for Rust dependency PRs: diff symbols, inspect build.rs, check advisories & provenance."
author: "booyaka101"
branding:
  icon: "shield"
  color: "orange"

inputs:
  github-token:
    description: "Token used to post the PR comment (usually secrets.GITHUB_TOKEN)."
    required: true
  max-crates:
    description: "Audit at most this many changed crates (the rest are listed as 'not audited'). Symbol-diffing every crate is slow."
    required: false
    default: "10"
  fail-on:
    description: "Fail the check when the overall risk tier reaches this level: none|medium|high|critical. Default 'none' = advisory comment only. Set e.g. 'critical' to block merges via branch protection."
    required: false
    default: "none"
  config:
    description: "Path (repo-relative) to the .rust-symbol-audit.toml config used to allow/ignore known-benign signals."
    required: false
    default: ".rust-symbol-audit.toml"
  reviews:
    description: "Path (repo-relative) to the review ledger. Signing off a (crate, version) makes future bumps alarm only on the unreviewed capability delta."
    required: false
    default: ".rust-symbol-audit/reviews.toml"
  check-provenance:
    description: "Query crates.io for publisher / source-repo / yank changes (needs network). Set to 'false' to disable."
    required: false
    default: "true"
  check-advisories:
    description: "Query OSV.dev (RustSec) for known advisories against the new version (needs network). Set to 'false' to disable."
    required: false
    default: "true"

outputs:
  changed:
    description: "Whether any crate versions changed in Cargo.lock."
    value: ${{ steps.parse.outputs.changed }}
  tier:
    description: "Highest risk tier detected (critical|high|medium|none)."
    value: ${{ steps.audit.outputs.tier }}
  flagged:
    description: "Comma-separated names of crates that had at least one flagged capability."
    value: ${{ steps.audit.outputs.flagged }}
  build-script-changes:
    description: "Number of audited crates whose build script was newly added or changed."
    value: ${{ steps.audit.outputs.build-script-changes }}
  advisories:
    description: "Count of known RustSec/OSV advisories found across audited crates."
    value: ${{ steps.audit.outputs.advisories }}
  recommendation:
    description: "auto-merge (overall tier none) or review — useful for gating Dependabot auto-merge."
    value: ${{ steps.audit.outputs.recommendation }}
  report:
    description: "Path to the machine-readable audit-report.json evidence file."
    value: ${{ steps.audit.outputs.report }}

runs:
  using: "composite"
  steps:
    - name: Ensure Rust toolchain
      shell: bash
      run: |
        if ! command -v cargo >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        rustc --version
        cargo --version

    - name: Cache rustfilt + cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/rustfilt
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
        key: rust-symbol-audit-${{ runner.os }}-rustfilt-v1

    - name: Install rustfilt (demangler)
      shell: bash
      run: |
        if ! command -v rustfilt >/dev/null 2>&1; then
          cargo install rustfilt --quiet
        fi
        rustfilt --version || true

    - name: Parse Cargo.lock diff
      id: parse
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_REF: ${{ github.sha }}
      run: |
        "${{ github.action_path }}/scripts/parse_lockdiff.sh" \
          "$BASE_SHA" "$HEAD_REF" "$RUNNER_TEMP/rsa/lockdiff.tsv"

    - name: Audit symbols & post comment
      id: audit
      if: steps.parse.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MAX_CRATES: ${{ inputs.max-crates }}
        FAIL_ON: ${{ inputs.fail-on }}
        RSA_CONFIG: ${{ inputs.config }}
        REVIEWS: ${{ inputs.reviews }}
        RSA_CHECK_PROVENANCE: ${{ inputs.check-provenance == 'false' && '0' || '1' }}
        RSA_CHECK_ADVISORIES: ${{ inputs.check-advisories == 'false' && '0' || '1' }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        LOCKDIFF_TSV: ${{ runner.temp }}/rsa/lockdiff.tsv
        WORK: ${{ runner.temp }}/rsa
      run: |
        "${{ github.action_path }}/scripts/run_audit.sh"

    - name: Upload audit evidence report
      if: steps.parse.outputs.changed == 'true' && steps.audit.outputs.report != ''
      uses: actions/upload-artifact@v4
      with:
        name: rust-symbol-audit-report
        path: ${{ runner.temp }}/rsa/audit-report.json
        if-no-files-found: ignore
